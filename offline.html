<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#061A33">
  <title>Offline — Arandia College eLMS</title>
  <style>
    :root { color-scheme: light dark; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
           font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
           background: #061A33; color: #fff; padding: 24px; text-align: center; }
    .card { max-width: 420px; }
    img { width: 96px; height: 96px; margin-bottom: 16px; }
    h1 { font-size: 1.5rem; margin: 0 0 8px; }
    p { color: #c9d6ea; line-height: 1.5; margin: 0 0 20px; }
    button { background: #FFD700; color: #061A33; border: 0; border-radius: 999px;
             padding: 12px 28px; font-size: 1rem; font-weight: 700; cursor: pointer; }
  </style>
</head>
<body>
  <div class="card">
    <img src="picture/logo.png" alt="Arandia College">
    <h1>You're offline</h1>
    <p>Walang koneksyon sa internet. Kailangan ng connection para magamit ang eLMS. Subukan ulit kapag nakakonekta ka na.</p>
    <button type="button" onclick="location.reload()">Try again</button>
  </div>
</body>
</html>
